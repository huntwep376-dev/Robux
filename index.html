<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Robux">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Robux</title>
<style>
:root{--fg:#101014;--muted:#6b6b76;--line:#e8e8ec;--accent:#00a2ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-touch-callout:none;-webkit-text-size-adjust:100%}
.app{height:100vh;height:-webkit-fill-available;height:100dvh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;margin:0;letter-spacing:-.2px}
main{flex:1;overflow-y:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
.inp{display:flex;gap:8px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:#fafafb}
.inp input{flex:1;border:0;outline:0;background:none;font-family:inherit;font-size:16px;padding:13px 0;color:#101014;min-width:0;
  -webkit-appearance:none;appearance:none;border-radius:0}
.inp button{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;
  padding:8px 14px;border-radius:10px;margin:7px 0;cursor:pointer}
button{-webkit-tap-highlight-color:transparent}
.card{display:flex;gap:14px;align-items:center;margin-top:18px;
  border:1px solid var(--line);border-radius:16px;padding:14px}
.card img{width:72px;height:72px;border-radius:50%;background:#f2f2f5}
.card p{margin:2px 0 0}
.card.hidden{display:none}
.muted{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><h1>Robux</h1></header>
  <main>
    <form class="inp" id="f">
      <input id="u" type="text" placeholder="Usuario de Roblox" autocomplete="off"
             autocapitalize="none" autocorrect="off" spellcheck="false">
      <button type="submit">Buscar</button>
    </form>
    <section id="out" class="card hidden"></section>
  </main>
</div>
<script>
const f=document.getElementById('f'),u=document.getElementById('u'),out=document.getElementById('out');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const n=u.value.trim();
  if(!n)return;
  out.classList.remove('hidden');
  out.innerHTML='<p class="muted">Buscando…</p>';
  try{
    const r=await fetch('https://users.roblox.com/v1/usernames/users',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({usernames:[n],excludeBannedUsers:true})});
    const d=await r.json();
    const usr=d.data&&d.data[0];
    if(!usr)throw 0;
    const t=await fetch('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+usr.id+'&size=150x150&format=Png&isCircular=true');
    const tj=await t.json();
    const img=(tj.data&&tj.data[0]&&tj.data[0].imageUrl)||'';
    out.innerHTML='<img src="'+img+'" alt=""><div><strong>'+esc(usr.displayName)+
      '</strong><p class="muted">@'+esc(usr.name)+' · ID '+usr.id+'</p></div>';
  }catch(err){
    out.innerHTML='<p class="muted">No se encontró ese usuario.</p>';
  }
});
</script>
</body>
</html>
